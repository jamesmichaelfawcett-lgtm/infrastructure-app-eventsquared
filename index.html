<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
<title>Klik Tech</title>

<link rel="manifest" href="./manifest.webmanifest">

<!-- iOS home screen behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klik Tech">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-32.png">
<meta name="theme-color" content="#0b1212">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:        #e7efee;
    --ink-dim:    #7c9291;
    --panel:      #101a1a;
    --panel-edge: #1d2b2a;
    --floor:      #0b1212;
    --cyan:       #00e6c3;
    --amber:      #ffab2e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--floor);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(0,230,195,0.07), transparent 60%);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
    opacity: 0;
    animation: rise 0.5s ease-out forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { body { animation: none; opacity: 1; } }

  .rack { width: 100%; max-width: 780px; }

  .rack-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 2px 18px; margin-bottom: 22px;
    border-bottom: 1px solid var(--panel-edge);
  }
  .rack-head .name { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.01em; }
  .rack-head .name b { color: var(--cyan); font-weight: 700; }
  .rack-head .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-dim); }

  .bay {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 620px) {
    .bay { grid-template-columns: 1fr; }
  }

  .module {
    position: relative;
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: linear-gradient(155deg, var(--panel) 0%, #0d1616 100%);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 26px 24px 22px;
    min-height: 190px;
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .module::before {
    content: "";
    position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
    background: var(--accent);
  }
  .module:active { transform: scale(0.985); }
  .module.on { border-color: color-mix(in srgb, var(--accent) 40%, var(--panel-edge)); }

  .module .row-top {
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .module .chan {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; color: var(--ink-dim);
    letter-spacing: 0.02em;
  }
  .module .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .module .led { animation: none; } }

  .module h2 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600; font-size: 30px; line-height: 1.05;
    margin: 22px 0 8px;
    color: #fff;
  }
  .module p {
    margin: 0; font-size: 13.5px; line-height: 1.5;
    color: var(--ink-dim); max-width: 30ch;
  }
  .module .go {
    position: absolute; right: 22px; bottom: 20px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--accent);
    opacity: 0.9;
  }

  .monitor   { --accent: var(--cyan); }
  .sequencer { --accent: var(--amber); }

  footer {
    margin-top: 26px; width: 100%; max-width: 780px;
    display: flex; justify-content: space-between;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px; color: #445655;
    padding: 0 2px;
  }

  #klik_status_bar_patch {
    position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top);
    background: var(--floor);
    z-index: 999999;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="klik_status_bar_patch"></div>
  <div class="rack">

    <div class="rack-head">
      <div class="name"><b>Klik</b> Tech</div>
      <div class="tag">on-site console</div>
    </div>

    <div class="bay">

      <a class="module monitor on" href="./app/klik/infrastructure_monitor.html">
        <div class="row-top">
          <span class="chan">CH.01</span>
          <span class="led"></span>
        </div>
        <h2>Monitor</h2>
        <p>Live status of every piece of infrastructure connected to this event.</p>
        <span class="go">open &#8250;</span>
      </a>

      <a class="module sequencer on" href="./app/klik/lightshow_sequencer.html">
        <div class="row-top">
          <span class="chan">CH.02</span>
          <span class="led"></span>
        </div>
        <h2>Sequencer</h2>
        <p>Build and run lightshow cues across the connected rig.</p>
        <span class="go">open &#8250;</span>
      </a>

    </div>

    <footer>
      <span>build 0.9.4</span>
      <span>eventsquared</span>
    </footer>

  </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').catch(function(err) {
        console.log('service worker registration failed', err);
      });
    });
  }
</script>

</body>
</html>
