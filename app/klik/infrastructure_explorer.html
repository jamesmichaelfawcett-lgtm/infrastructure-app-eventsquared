function run_search(data) {
    if (data.filter.length>1) {
        // got a [key, value] pair, such as ['last_name','rousseau'], or ['custom_fields.Gender', 'male']
        Object.assign(data.results, search_key_value_and_add_to_object(data.filter[0], data.filter[1], data.input));
    }
   
    else {
        // got a simple value to match, such as : ['rousseau']
        Object.assign(data.results, search_value_and_add_to_object(data.filter[0], data.input));
    }
}
          

function search_value_and_add_to_object(val, dict) {
    section_filters_title.innerHTML += JSON.stringify({val:val});
    var result = {};
    for (var k in dict ) {
        if (JSON.stringify(dict[k]).toString().toLowerCase().match(val.toLowerCase())) {
            result[k] = dict[k];
        }
    }
    return result;
}


function search_key_value_and_add_to_object(key, val, dict) {
    section_filters_title.innerHTML += JSON.stringify({key:key, val:val});
    var result = {};
    var value;
    var parts = key.split('.');
    for (var k in dict) {
        value = dict[k];
        for (var i=0; i<parts.length; i++) {
            var next_level = value[parts[i]]
            if (next_level) {
                value = next_level
            }
        }
        if (value!=null && value.toString().toLowerCase().match(val.toLowerCase())) {
            result[k] = dict[k];
        }   
    }
    return result;
}

function klik_parse_event_data(data) {
    var html = '<table>';
    for (var key in data) {
        html += '<p><tr><td style="text-align:right;">'+ Object.keys(data[key]).length + '</td><td><a style="text-decoration:none; color:#00ffB9;" href="#'+key+'"> '+key+'</a></td></tr><ta</p>'
        // console.log(data);
    }
    html += '</table>';
    return html;
}

function apply_filter(data) {

function reset(show_filters=true) {
    for (var k in text) {
        hide(by_id('section_'+k));
        hide_predefined_filters();
    }

    if (show_filters) {
        show(section_filters);
    }
    else {
        hide(section_filters)
    }
}
