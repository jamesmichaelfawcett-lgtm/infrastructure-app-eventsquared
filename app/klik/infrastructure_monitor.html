function klik_monitor_clear() {

    }
    klik_monitor_tables = [];
}

function klik_monitor_save() {
    app.save_config(klik_monitor_config);
}


function klik_monitor_toggle(key) {
    klik_monitor_config.fetch[key] = app.api.fetch[key] = 1-app.api.fetch[key];

    klik_monitor_save();
    klik_monitor_clear();
    klik_monitor_update_sidebar();
    klik_monitor_page_refresh();
}


function klik_monitor_interval(interval_in_ms) {
    klik_monitor_config.autorun = interval_in_ms;

    klik_monitor_save();
    klik_monitor_update_sidebar();

    app.api.autorun(klik_monitor_config.autorun);


    var intervals = [ 2000, 5000, 10000];
    for (var i in intervals) {
        var btn = by_id(klik_monitor_sidebar_scope+'button_interval_'+intervals[i]);
        btn.innerHTML = 'refresh '+intervals[i]+' ms';
        btn.style.backgroundColor = 'rgba(255,0,0,0.4)';
        btn.style.border = '1px solid red';
    }

    var btn = by_id(klik_monitor_sidebar_scope+'button_interval_'+interval_in_ms);
    btn.style.backgroundColor = 'rgba(0,255,255,0.4)';
    btn.style.border = '1px solid cyan';
}



function klik_monitor_populate_sidebar(scope, style) {
    klik_monitor_sidebar_scope = scope;

    var s = add_node(klik_toolbar_settings, 'div', { _c:'klik_section' });
    add_node(s, 'button', { _c:'small', _s:style, onclick:'klik_monitor_toggle("maps")'            , _i:scope+'button_toggle_maps' });
    add_node(s, 'button', { _c:'small', _s:style, onclick:'klik_monitor_toggle("locations")'       , _i:scope+'button_toggle_locations' });
    add_node(s, 'button', { _c:'small', _s:style, onclick:'klik_monitor_toggle("infrastructures")' , _i:scope+'button_toggle_infrastructures' });
    add_node(s, 'button', { _c:'small', _s:style, onclick:'klik_monitor_toggle("attendees")'       , _i:scope+'button_toggle_attendees' });

    var s = add_node(klik_toolbar_settings, 'div', { _c:'klik_section' });
    add_node(s, 'button', { _g:1, _c:'small', _s:style, onclick:'klik_monitor_interval(2000)' , _i:scope+'button_interval_2000' });
    add_node(s, 'button', { _g:1, _c:'small', _s:style, onclick:'klik_monitor_interval(5000)' , _i:scope+'button_interval_5000' });
    add_node(s, 'button', { _g:1, _c:'small', _s:style, onclick:'klik_monitor_interval(10000)', _i:scope+'button_interval_10000' });

    var s = add_node(klik_toolbar_settings, 'div', { _c:'klik_section' });
    add_node(s, 'button', { _c:'small', _s:style, onclick:'show(config)', _i:scope+'button_show_data', _l:'show JSON' });
    add_node(s, 'button', { _c:'small', _s:style, onclick:'hide(config)', _i:scope+'button_hide_data', _l:'hide JSON' });


    setTimeout(function() {
        klik_monitor_update_sidebar();
    }, 1000);

}


function klik_monitor_update_sidebar() {
    var keys = ['maps', 'locations', 'infrastructures', 'attendees'];
    for (var i in keys) {
        var k = keys[i];

        var btn = by_id(klik_monitor_sidebar_scope+'button_toggle_'+k);
        btn.innerHTML = k;

        if (app.api.fetch && app.api.fetch[k]) {
            btn.style.backgroundColor = 'rgba(0,255,255,0.4)';
            btn.style.border = '1px solid cyan';
        }
        else {
            btn.style.backgroundColor = 'rgba(255,0,0,0.4)';
            btn.style.border = '1px solid red';
        }
    }
}

function get_filter(namespace) {
    return sort_filters[namespace];
}


function sort_data(namespace) {
    try {
        var filter = get_filter(namespace);
        // console.log('namespace:', namespace, 'filter:', filter);
        klik.data[namespace].sort(klik_sort_anything(filter.key)[filter.order]);
        return true;
    }
    catch(e) {
        // console.log('unable to sort', namespace, filter.key, filter.order);
        // console.log(e);
        return false;
    }
}


function handle_data(namespace, data) {
    // console.log(namespace, data);

    if (dragging) {
        return;
    }

    // remove forward slash, because using namespace as key
    if (namespace=='/maps' || 
        namespace=='/locations' || 
        namespace=='/attendees' || 
        namespace=='/infrastructures' ) {
        namespace = namespace.substring(1);
    }

    if (namespace=='maps') {
        for (var i=0; i<data.length; i++) {
            klik.dict[data[i].name] = data[i];
        }
        klik.data.maps = data;
        sort_data(namespace);

        var label = ((klik.data.maps.length>1)?'maps':'map');
        label_maps.innerHTML = klik.data.maps.length+' '+label;

        add_tables('maps');
        // $('#table_maps_0').addClass("hidden_data");
        // $('#table_maps_1').addClass("hidden_header");
    }
    
    else if (namespace=='locations') {
        for (var i=0; i<data.length; i++) {
            klik.dict[data[i].name] = data[i];
        }
        klik.data.locations = data;
        sort_data(namespace);

        var label = ((klik.data.locations.length>1)?'locations':'location');
        label_locations.innerHTML = klik.data.locations.length+' '+label;

        add_tables('locations');
        // $('#table_locations_0').addClass("hidden_data");
        // $('#table_locations_1').addClass("hidden_header");
    }

    else if (namespace=='attendees') {
        for (var i=0; i<data.length; i++) {
            klik.dict[data[i].id] = data[i];
        }
        klik.data.attendees = data;
        sort_data(namespace);

        var label = ((klik.data.attendees.length>1)?'attendees':'attendee');
        label_attendees.innerHTML = klik.data.attendees.length+' '+label;

        add_tables('attendees');
        // $('#table_attendees_0').addClass("hidden_data");
        // $('#table_attendees_1').addClass("hidden_header");
    }

    else if (namespace=='infrastructures') {
        
        for (var i=0; i<data.length; i++) {
            klik.dict[data[i].id] = data[i];
        }
        for (var i=0; i<klik_device_types.length; i++) {
            klik.data[klik_device_types[i]] = [];

        klik.data.infrastructures_tags_ignored = [];

                    // if (data[i].type=='beacon') {

                    //         console.log(data[i]); 
                    //     }
                    // }

                    if (data[i].map) {
                        klik.data[klik_device_types[j]].push(data[i]);
                    }
                    else if (data[i].type=='tag') {
                        klik.data.infrastructures_tags_ignored.push(data[i]);

            }
        }

        // at this point, all data is stored inside klik.data
        // for (var i=0; i<klik.data.infrastructures_tags.length; i++) {
        //     var tag = klik.data.infrastructures_tags[i];
        // }

        // here we only update all table titles (labels) with 
        // the corresponding device counters
        for (var i=0; i<klik_device_types.length; i++) {
            var type = klik_device_types[i];
            var data = klik.data[type];
            var label = type;

            // console.log(label);

            // replace the beacons with hubs
            if (label=='infrastructures_beacons') {
                label = 'infrastructures_hubs';
            }
   
            if (label.match('infrastructures')) {
                label = label.substring(16, label.length);
            }

            // adjust label for singular / plurar
            label = ((data.length>1) ? label : label.substring(0, label.length-1));

            if (type=='infrastructures_pixels') {
                label_infrastructures_pixels.innerHTML = klik.data.infrastructures_pixels.length+' '+label+' - plus '+klik.data.infrastructures_pixels_ignored.length+' not on the map';
                label_infrastructures_pixels.innerHTML += ' - total of '+ (klik.data.infrastructures_pixels.length+klik.data.infrastructures_pixels_ignored.length);

            klik.table[key][0].innerHTML = ''; // table for headers

            // }
            // else {

                // remember current widths for all columns
                // look only at first table row
                // var item = by_id('table_'+key+'_1');
                // var cols;
                // try {
                //     cols = item.getElementsByTagName("tr")[1].getElementsByTagName("td");
                //     conf.header_widths[key] = []
                //     for (k = 0; k<cols.length; k++) { // loop all column items

                //     }

                // $('#table_'+key+'_0').addClass("hidden_data");
                // $('#table_'+key+'_1').addClass("hidden_header");
            // }
        }
    }


    // setup visibility based on what was setup in the Manager
    // looking at the one config icon that is named 'MainConfig'

    if (klik.data.configs && klik.data.configs.length>0) {
        // console.log('---------', klik.data.configs);
        for (var i in klik.data.configs) {
            // console.log(klik.data.configs[i]);
            if (klik.data.configs[i].name==='MainConfig') {

    klik_table_search_all();

// make everything clickable
function setup_cell_interaction(tables, namespace, index) {
    // console.log('setup_cell_interaction', namespace, tables)
    var table = tables[namespace][index];

    if (table != null) {
        for (var i = 0; i < table.rows.length; i++) {
            for (var j = 0; j < table.rows[i].cells.length; j++) {

                table.rows[i].cells[j].onclick = function (event) {
                    var item = klik.dict[event.target.innerHTML];
                    if (item) {
                        config_string.innerHTML = event.target.innerHTML+'<PRE>'+JSON.stringify(item, null, '  ')+'</PRE>';
                    }
                    else {
                        var element = event.target;
                        if (element.nodeName === "TH") {
                            var filter = get_filter(namespace);
                            filter.order = (filter.order=='down')?'up':'down';
                            filter.key = element.id.substring(3);
                            // console.log(namespace, filter)

                            // sort, clear and rebuild
                            if (sort_data(namespace)) {
                                klik.table[namespace][0].innerHTML = '';
                                add_tables(namespace); 

                                klik_table_search('table_'+namespace+'_0');
                            }
                        }
                        config_string.innerHTML = 'nothing found for : "'+ element.innerHTML +'"';
                    }
                };
            }
        }
    }
}

function build_html_table(table, arr, headers) {
   
    // console.log(table, arr, headers)

    var columns = [];

    // build headers, ids are important
    var tr = proto.tr.cloneNode(false);
    for (var i=0; i<headers.length; i++) {
        columns.push(headers[i]);
        var th = proto.th.cloneNode(false);
        if (typeof(headers[i])=='object' && headers[i].length>=2) {
            th.appendChild(document.createTextNode(headers[i][1]));
            th.id = 'th_'+headers[i][0];
            // console.log(th.id);
        }
        tr.appendChild(th);
    }
    table.appendChild(tr);


    var widths = []
    for (var i=0, maxi=arr.length; i < maxi; ++i) {

        var tr = proto.tr.cloneNode(false); // table row
        widths[i] = 0;

        for (var j=0, maxj=columns.length; j < maxj ; ++j) {
            var td, header, val;

            td = proto.td.cloneNode(false); // table data (cell)
            header = columns[j];
            val = null;
           
            // var voltage = arr[i]['status']['battery_mV']/1000.;
            // if (voltage==klik_hub_voltage) {
            //     val = 'N/A'; // no battery level when it's a hub
            // }
            // else {
            //     val = klik_get_battery_level_formatted(voltage);
                
            //     if (voltage > klik_battery_voltage_fresh) {
            //         td.style.color = theme.color.healthy;
            //     }
                
            //     if (voltage < klik_battery_voltage_warning) { 
            //         td.style.color = theme.color.warning;
            //     }

            //     if (voltage < klik_battery_voltage_critical) { 
            //         td.style.color = theme.color.critical;
            //     }
            // }
            
            // else if (header==='bars' || header[0]=='bars') {
            //     var voltage = arr[i]['status']['battery_mV']/1000.;
            //     if (voltage==klik_hub_voltage) {
            //         val = 'N/A'; // no battery level when it's a hub
            //     }
            //     else {
            //         val = klik_get_battery_level_bar(voltage);
            //         if (voltage > klik_battery_voltage_fresh) {
            //             td.style.color = theme.color.healthy;
            //         }
            //         if (voltage < klik_battery_voltage_warning){
            //             td.style.color = theme.color.warning;  
            //         } 
            //         if (voltage < klik_battery_voltage_critical) {
            //             td.style.color = theme.color.critical;
            //         }
            //     }
            // }

            var parts = [];
            if (typeof(header)=='object') {
                parts = header[0].split('.');
            }
            else {
                parts = header.split('.');
            }

            val = arr[i];
            for (var k=0; k<parts.length; k++) {
                if (val[parts[k]]!=null) {
                    val = val[parts[k]];
                }
                else {
                    val = null;
                    break;
                }
            }
            
            if (typeof(val)=='object') {
                var str = '';
                for (var idx in val) {
                    if (val[idx].id) {
                        str += val[idx].id+', ';
                    }
                }

                if (str!='') {
                    val = str;
                }
            }

            if (val) {
                val = val.toString();
            }

            if (header[1]=='MAP.X' || header[1]=='MAP.Y') {
                val = Math.round(val*100)/100.;
            }

            if (header[1].match('%')) {
                if (val) {
                    val = 100 * Math.round(val*100)/100.;
                }
            }

            if (header[1].match('/s') ) {
                val = Math.ceil(val);
            }

            if (header[1].match('PKT') || header[1].match('BLE IN') ) {
                if (val) {
                    val = Math.ceil(val);
                }
            }


            // if (header[0]=='status.status') {
            //     if (val=='critical') {
            //         tr.style.color = '#f00';
            //     }
            // }
     
            // if (typeof val === 'object') {
            //     val = JSON.stringify(val);
            // }
            if (header[1]=='MASTER') {
                if (val=='1') {
                    tr.style.color = theme.color.warning; // row cyan
                }
            } 

            // if (header[0].match('URL')) {
            //     val = '<a href='+val+'>link</link>';
            // }


             // styling based on content
            if (val=='0') {
                // td.style.color = '#888';
            }
            
            if (parts[k-1]=='timeout' && val!='120' ) {
                td.style.color = theme.color.warning; // cell orange
            }
            else if (parts[k-1]=='samples' && val!='60' ) {
                td.style.color = theme.color.warning; // cell orange
            }
            else if (parts[k-1]=='stickiness' && val!='60' ) {
                td.style.color = theme.color.warning; // cell orange
            }
            else if (val==='healthy') {
                td.style.color = theme.color.healthy; // cell cyan
            }
            else if (val==='warning') {
                td.style.color = theme.color.warning; // cell orange
            }
            else if (val==='critical') {
                tr.style.color = theme.color.critical; // entire row red
            }
            else if (val==null || val=='null') {
                // td.style.fontStyle = 'italic';
                // theme.color.warning;
                td.style.color = '#666'; 
                val = '-';
            }
            else if (typeof(val)=='string' && val.match('Not heard in')) {
                // td.style.color = theme.color.warning;
                var seconds = parseInt(arr[i]['status']['last_heard']);
                val = hh_mm_ss_since(seconds, 'ago');
            }
            else if (typeof(val)=='string' && val.match('Missed packets')) {
                // td.style.color = theme.color.warning;
                var seconds = parseInt(arr[i]['status']['last_heard']);
                val = hh_mm_ss_since(seconds, 'ago - '+val);
                td.style.color = theme.color.warning;
            }
            else if (typeof(val)=='string' && parts[k-1]=='last_heard') {
                // td.style.color = theme.color.warning;
                val = new Date(parseInt(arr[i]['status']['last_heard'])*1000).toLocaleString();
            }
            else if (typeof(val)=='string' && parts[k-1]=='time') {
                // td.style.color = theme.color.warning;
                // // val = new Date(parseFloat(val)*1000);
                val = new Date(val).toLocaleString();
            }

            // any other filed that contains the wording LAST
            // will be showed as a time string
            else if (header[1].match('LAST') ) {
                // console.log(parts[k-1]);
                val = new Date(parseInt(arr[i]['status'][parts[k-1]])*1000).toLocaleString();
            }
            else if ((parts[k-1]=='battery' || parts[k-1]=='peripheral_battery')) {
                if (val<=BATTERY_LEVEL_LOW) {
                    if (arr[i].status.status!='critical') {
                        add_class(td, 'pulse');
                        td.style.color = theme.color.warning;
                    }
                }
                else if (val>=BATTERY_LEVEL_HIGH ) {
                    td.style.color = theme.color.healthy;
                }
            }

            if (val && val.length>widths[i]) {
                widths[i] = val.length;
            }

            if (header[0].match('url')) {
                var link = document.createElement('a');
                var text = document.createTextNode('link');
                link.append(text);
                link.href = val;
                // console.log(val);
                td.appendChild(link);
            } 
            else {
                td.appendChild(document.createTextNode(val));
            }
            tr.appendChild(td);           
        }
        table.appendChild(tr);
    }

    // console.log(widths);
    // setup a row with all the longest content foreach column
  
    // var tr = proto.tr.cloneNode(false);
    // table.appendChild(tr);
    // for (var j=0, maxj=columns.length; j < maxj ; ++j) {
    //     var td = proto.td.cloneNode(false);
    //     var txt = '.';
    //     while(txt.length<widths[j]) {
    //         txt+='.'
    //     }
    //     td.appendChild(document.createTextNode(txt));
    //     tr.appendChild(td);   
    // }

    // console.log(table)

    return table;
 }

function klik_table_search(table_id) {

    // Declare variables 
    var input, filter, table, tr, td, i;

    input = by_id("klik_search");
    filter = input.value.toUpperCase();

    table = by_id(table_id);
    tr = table.getElementsByTagName("tr");

    // Loop through all table rows, and hide those who don't match the search query
    var got_at_least_one = false;
    for (i = 1; i < tr.length; i++) {
        var cols = tr[i].getElementsByTagName("td");
        tr[i].style.display = 'none';
        for (j = 0; j < cols.length; j++) { // loop all column items
            td = cols[j];
            if (td && td.innerHTML.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = ''; // got one
                got_at_least_one = true;
                continue;
            } 
        } 
    }

    var section = table.parentElement.parentElement;
    if (got_at_least_one) {
        section.style.display = 'block';
    }
    else {
        section.style.display = 'none';
    }

}
