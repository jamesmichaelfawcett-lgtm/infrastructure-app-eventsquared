<html>
<head>
<meta charset='utf-8'>
<link rel='stylesheet' href='../../lib/klik_app.css' >
<style>
  #klik_loading_overlay {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: #0b1212;
    transition: opacity 0.25s ease;
  }
  #klik_loading_overlay.klik_loading_hidden { opacity: 0; pointer-events: none; }
  .klik_loading_panel { width: 240px; text-align: center; }
  .klik_loading_led {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffab2e; margin: 0 auto 18px;
    box-shadow: 0 0 10px #ffab2e;
    animation: klik_loading_pulse 1.4s ease-in-out infinite;
  }
  @keyframes klik_loading_pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .klik_loading_label {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12.5px; letter-spacing: 0.02em; color: #7c9291;
    margin-bottom: 14px;
  }
  .klik_loading_track { height: 3px; width: 100%; background: #1d2b2a; border-radius: 2px; overflow: hidden; }
  .klik_loading_bar { height: 100%; width: 4%; background: #ffab2e; transition: width 0.2s ease; }

  /* solid strip behind the iPad's status bar (clock/wifi/battery) —
     without this, the toolbar's translucent background lets scrolling
     content show through that strip */
  #klik_status_bar_patch {
    position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top);
    background: #000;
    z-index: 999999;
    pointer-events: none;
  }
</style>
<script type='text/javascript' src='../../lib/klik_app.js'></script>
<script type='text/javascript' src='../../lib/klik_loading.js'></script>
<script type='text/javascript'>


window.onload = function() {
    app = new KlikApp('tech', 'Lightshow Sequencer', 'klik', true, true ); // settings, debug

    app.callbacks = {
        on_ws_open : function() {
            klik_send_off_state();
        },
        
        on_ws_message : function(data) {

        },

        on_config_loaded : function(data) {
            sequencer.on_config_loaded(data);
        },

        on_config_missing : function(init_ui=true) {
            sequencer.on_config_missing(init_ui);
        },

        on_app_ready : function() { 

            priority = new KlikPriority({
                on_priority_change : function(value) {
                    sequencer.set_priority(value);
                }
            });


            rssi = new KlikRssi({ 
                min : 0, 
                max : 120, 
                value : 120, 
                on_rssi_change : function(value) {
                    sequencer.set_rssi(value, true);
                }
            });


            interface = new KlikInterface({
                on_interface_change : function(value) {
                    if (value=='REMOTE') {
                        app.api.get_all_infrastructures();
                    } 
                    sequencer.set_interface(value);
                },
                on_hubs_change : function(status, value) {
                    sequencer.set_hubs(status, value);
                },
            });


            dimmer = new KlikDimmer({
                min : 0,
                max : 100,
                inc : 10,
                value : 100,
                on_dimmer_change_percent : function(value) {
                    sequencer.set_dimmer(value);
                }
            });

            

            sequencer = new KlikSequencer({
                on_hubs_change : function(status, value) {

                    switch (status) {
                        case 'user': 
                        case 'online':
                        case 'offline': 
                        case 'unassigned': 
                            interface.set_targets(status, value); 
                            break;

                        default:
                            self.cout('unable to change hubs');
                    }
                }, 

                references : {
                    ui_priority  : priority,
                    ui_interface : interface,
                    ui_dimmer    : dimmer,
                    ui_rssi      : rssi,
                }

            });

            // load default configs
            // app.load_config();

            // allow older versions (will load the first one found)
            app.load_config(true, ['0.9.3', '0.9.2', '0.9.1', '0.9.0', '0.8.36', '0.8.35', '0.8.34']); 


            // get hubs that are on the map
            app.api.get_all_infrastructures();

        },

        on_app_data(namespace, data) {
            sequencer.on_app_data(namespace, data);
        },

    }
}


function on_modal_open(event) {
    sequencer.on_modal_open(event);
}

</script>
</head>
<body class="klik_app theme_klik">
<div id="klik_status_bar_patch"></div>
<div id="klik_loading_overlay" class="klik_loading_overlay">
  <div class="klik_loading_panel">
    <div class="klik_loading_led"></div>
    <div class="klik_loading_label" id="klik_loading_label">Starting up</div>
    <div class="klik_loading_track"><div class="klik_loading_bar" id="klik_loading_bar"></div></div>
  </div>
</div>
</body>
</html>
